<!dotype html>
<html>
        <head>
            <title>1장-자바스크립트 콘솔</title>
        </head>
        <body>
            <p>개발자 도구 콘솔에서 console.log()를 확인하세요.</p>
            <script>
                //console.log("hellow world."); //콘솔 테스트
                //console.log("안녕하세용"); //콘솔 테스트
                //console.log("1111"); //콘솔 테스트
                //console.log(2026); //콘솔 테스트

                //연습1 : 본인 이름 출력
                 console.log("김유진"); //콘솔 테스트

                //연습2 : 올해년도 출력
                var year = 2026;
                 console.log(year); //콘솔 테스트

                 //연습3 : '저는 20살 입니다.' 나오게 출력
                var age = 20;
                 console.log("저는 " + age + "살 입니다. "); //콘솔 테스트
                console.log("저는", age, "살 입니다. "); //콘솔 테스트
                console.log(false, true); //콘솔 테스트
                
                //연습4 : '좋아하는 음식은 파스타 입니다.' 를 콤마를 사용해 출력.
                var foodName = "파스타";
                console.log("좋아하는", "음식은", foodName , "입니다."); //콘솔 테스트


</script>
        </body>
</html>
