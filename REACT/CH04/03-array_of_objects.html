<!dotype html>
<html>
        <head>
            <title>3장-자바스크립트 array_of_objects</title>
        </head>
        <body>
            <p>배열과 객체 혼합연습 페이지 입니다.</p>
            <script>
                const contact = [
                                {name : "영지", age : 20, city : "서울" },
                                {name : "미미", age : 21, city : "부산" },
                                {name : "유진", age : 22, city : "광주" },
                                {name : "은지", age : 23, city : "대전" },
                            ];
                
                // 이름이 유진인 객체를 콘솔에 출력
               // console.log(contact[2]);
                
                // 이름이 미미인 객체의 나이 출력
                //console.log(contact[1].age);

                const myInfo = {name : "김유진", age : 38, city : "서울"};
                contact.push(myInfo);
                //console.log(contact[contact.length - 1]);

                for(let i = 0; i < contact.length; i++){
                    const person = contact[i];
                    const personName = contact[i].name;
                    console.log(person);
                    console.log(personName);
                }
            </script>
        </body>
</html>
