        <body>

            <div id = "output" style = "font-size:18px; margin-top:12px; line-height: 1.8;"></div>
            <script>
                 const numbers = [ 1, 2, 3, 4];

                 // 연습1 : doubleNumbers에 numbers를 2배한 결과를 넣기. [2, 4, 6, 8] 를 넣기
                 const doubleNumbers = [];
                 let result = 0;
                 for(let i = 0; i < numbers.length; i++){
                    result =  numbers[i] * 2;
                    doubleNumbers.push(result);
                 }
                // console.log(doubleNumbers);

                 //간단한 또다른 방법
                 const doubleNumbers2 = numbers.map((m) => m * 2);
                // console.log(doubleNumbers2);
                 /* 
                  배열에 달려있는 기본 함수 map은 배열의 각 항목을 바꿔가면서 새배열을 돌려주는데
                  map 함수에 인자로 들어간 함수를 호출해서 작업 후에 새 배열로 만들어 준다.
                 */

                 // 연습 1 : numbers3 상수 정의 numbers의 5배를 넣기
                 const numbers3 = numbers.map((m) => m * 5);
                // console.log(numbers3);

                 // 연습 2 : numbers4 상수 정의, {}와 return사용 numbers의 5배를 넣기
                 const numbers4 = numbers.map((m) => {
                     return m * 4
                });
                // console.log(numbers4);

                });
