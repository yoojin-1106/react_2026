<!dotype html>
<html>
        <head>
            <title>2장-자바스크립트 if-else</title>
        </head>
        <body>
            <p>if-else연습 페이지 입니다.</p>
            <div id = "output"></div>
            <script>
                //if() => 괄호 안에는 판별식 => true 또는 false
                if(10 > 1){
                    console.log("10 > 1", 10 > 1);
                }else{
                    console.log("참이 아닌경우 출력");
                }

                const score = 83;
                let grade = "";

                if(score >= 90){
                  grade = "A";
                }else if(score < 90 && score >= 80){
                  grade = "B";
                }else if(score < 80 && score >= 70 ){
                  grade = "C";
                }else{
                  grade = "F";
                }

                const text = `점수 ${score}점 -> 학점 ${grade}`;
                console.log(text);

                const div = document.getElementById("output");

                div.textContent = text;
            </script>
        </body>
</html>
