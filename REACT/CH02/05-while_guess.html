<!dotype html>
<html>
        <head>
            <title>5장-자바스크립트 while</title>
        </head>
        <body>
            <p>while문연습 페이지 입니다.</p>
            <div id="output"></div>
            <script>
                /*   while문 연습 반복문. while(조건식){} */

                let i = 1;
                while(i <= 10){
                    document.getElementById("output").innerHTML += i + "<br>";
                    i++;
                }

                let j = 1;
                while(j <= 10){
                    if(j ===7 ){
                        break;
                    }
                    j++;
                }


                const answer = Math.floor(Math.random() * 100) + 1;
                const guesses = [3, 10, 5, 7, 9];

                let index = 0;
                let found = false;

                while(index < guesses.length){
                    if(guesses[index] === answer){
                        found = true;
                        break;
                    }
                    index++;

                }



            </script>
        </body>
</html>
