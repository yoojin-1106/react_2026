<!dotype html>
<html>
        <head>
            <title>2장-자바스크립트 변수</title>
        </head>
        <body>
            <p>변수연습 페이지 입니다.</p>
            
            <script>
                //변수 : 변경가능, 상수 : 변경불가.
                //age 변수에 21라는 숫자를 담기.
                let age = 21;
                //console.log("age :", age);
                 
                //age 변수에 41라는 숫자를 담기.
                age = 41;
                //console.log("age :", age);
                //age 값이 변경됨을 확인

                //name 상수에 홍길동 담기.
                const name = "홍길동";
                //console.log("name :", name);

                //name 상수에 홍길동1 담기. 에러확인
                // name = "홍길동1";
                //console.log("name :", name);


                //연습1 : score에 100
                let score = 100;
                console.log("score :", score);
                 
                //연습2 : score에 90
                score = 90;
                console.log("score :", score);
                //score 값이 변경됨을 확인

                 //연습3 : hobby
                const hobby = "게임";
                console.log("hobby :", hobby);

                 //연습4 : hobby에 낚시
                hobby = "낚시";
                console.log("hobby :", hobby);

            </script>
        </body>
</html>
